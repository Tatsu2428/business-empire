<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b2d"><title>BUSINESS EMPIRE</title>
<style>
:root{color-scheme:dark;--bg:#0b1422;--panel:#142238;--panel2:#1b2e47;--line:#2b4260;--text:#eaf2ff;--muted:#9fb2ca;--gold:#f3c76a;--green:#66d6a1;--red:#ff8585}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#284565 0,#0b1422 55%);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{border:1px solid #45617f;background:#263e5b;color:white;padding:9px 13px;border-radius:10px;cursor:pointer}button:hover{background:#355477}button.primary{background:#b98735;border-color:#e1b65e;color:#1c2330;font-weight:800}button:disabled{opacity:.4;cursor:not-allowed}.wrap{max-width:1440px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.brand{font-size:24px;font-weight:900;letter-spacing:2px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:3px}.stats{display:grid;grid-template-columns:repeat(5,minmax(115px,1fr));gap:9px;margin:16px 0}.stat,.panel{background:linear-gradient(145deg,#192b43,#101d30);border:1px solid var(--line);border-radius:15px;padding:13px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:20px}.city{height:310px;border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative;background:linear-gradient(#5e829d 0%,#b0c3c6 55%,#536e75 56%,#263e48 100%);margin-bottom:15px}.city:before{content:"";position:absolute;inset:55% 0 0;background:repeating-linear-gradient(90deg,transparent 0 85px,#ffffff08 86px 88px),linear-gradient(#304958,#172b39)}.sun{position:absolute;right:12%;top:12%;width:62px;height:62px;border-radius:50%;background:#ffe4a4;box-shadow:0 0 55px #ffe4a477}.skyline{position:absolute;bottom:0;left:0;right:0;height:85%;display:flex;align-items:end;justify-content:space-around;padding:0 3%;gap:9px}.building{position:relative;min-width:8%;max-width:16%;flex:1;border:2px solid #d6e2e044;border-bottom:0;background:linear-gradient(90deg,#23384d,#526d7d 48%,#293e53);box-shadow:8px 0 16px #13243366;display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px}.building:before{content:"";position:absolute;inset:9px;background:repeating-linear-gradient(0deg,transparent 0 17px,#f6d98b99 18px 23px),repeating-linear-gradient(90deg,transparent 0 17px,#f6d98b99 18px 23px);opacity:.65}.building b{z-index:1;text-shadow:0 2px 5px #000}.citylabel{position:absolute;top:14px;left:16px;color:#102438;font-weight:900;text-shadow:0 1px #ffffff80}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,.8fr);gap:14px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tabs button.active{background:#b98735;color:#182335;border-color:#e1b65e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:10px}.tile{background:#1b2e47;border:1px solid var(--line);border-radius:13px;padding:12px}.tile h3{margin:0 0 4px;font-size:16px}.tile p{margin:4px 0 10px;color:var(--muted);font-size:12px}.tile .price{color:var(--gold);font-weight:800}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.muted{color:var(--muted)}.log{max-height:250px;overflow:auto;font-size:13px}.log div{padding:7px 0;border-bottom:1px solid #2b426055}.bar{height:7px;background:#30445c;border-radius:8px;overflow:hidden;margin:5px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#4fc79c,#e6c16b)}input,select{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:#0d1929;color:var(--text);margin:4px 0 9px}.actions{display:flex;gap:7px;flex-wrap:wrap}.foot{color:var(--muted);font-size:11px;margin:18px 0}.hide{display:none}@media(max-width:850px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.stat:last-child{grid-column:span 2}.city{height:230px}} 
</style></head><body><main class="wrap">
<header class="top"><div class="brand">BUSINESS EMPIRE<small>BUILD · MANAGE · EXPAND</small></div><div class="actions"><button onclick="save()">保存</button><button onclick="load()">読込</button><button onclick="exportSave()">書き出し</button><button onclick="document.getElementById('importFile').click()">取込</button><input id="importFile" class="hide" type="file" accept="application/json" onchange="importSave(event)"></div></header>
<div class="row"><div><b id="companyName">NOVA GROUP</b> <span class="muted" id="sector">総合企業</span></div><div class="muted" id="date">創業1年目 1月1日</div></div>
<section class="stats"><div class="stat"><span>現金・資金</span><strong id="cash">¥0</strong></div><div class="stat"><span>企業価値</span><strong id="worth">¥0</strong></div><div class="stat"><span>株価</span><strong id="share">未上場</strong></div><div class="stat"><span>従業員</span><strong id="staff">0人</strong></div><div class="stat"><span>評判 / 市場シェア</span><strong id="reputation">50 / 0%</strong></div></section>
<section class="city"><div class="sun"></div><div class="citylabel">YOUR BUSINESS DISTRICT</div><div class="skyline" id="skyline"></div></section>
<div class="layout"><section class="panel"><nav class="tabs" id="tabs"></nav><div id="main"></div></section><aside class="panel"><div class="row"><h3>経営ダッシュボード</h3><span class="muted" id="mood">安定</span></div><div id="dashboard"></div><hr style="border-color:var(--line)"><div class="row"><h3>経営ニュース</h3><button onclick="nextDay()" class="primary">1日進める ▶</button></div><div class="log" id="log"></div><div class="foot">ゲーム内時間は「1日進める」で進行します。セーブデータはこのブラウザ内に保存されます。</div></aside></div>
</main><script>
const $=id=>document.getElementById(id), yen=n=>'¥'+Math.floor(n).toLocaleString('ja-JP'), clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const facilityTypes=[['本社','🏢',5000000,2],['小売店舗','🏬',1800000,1],['工場','🏭',4200000,2],['研究開発','🔬',6000000,3],['物流センター','🚚',3000000,2],['飲食店','🍽️',1200000,1],['ホテル','🏨',9000000,4]];
const branchNames=['東京','大阪','名古屋','札幌','シンガポール','ニューヨーク'];
let s;
function fresh(){return {name:'NOVA GROUP',sector:'総合企業',cash:30000000,debt:0,shares:0,sharePrice:100,employees:8,rep:52,day:1,month:1,year:1,facilities:[],branches:[],products:[{name:'NOVA One',price:1200,quality:55,stock:300,sales:0}],logs:['会社を設立しました。事業を開始しましょう。'],history:[],rivals:[{name:'ALPHA INDUSTRIES',share:18},{name:'ZENITH CORP.',share:14},{name:'ORBIT WORKS',share:11}],market:100,economy:1,loanRate:.04,ipo:false,dividend:0,expenses:0,revenue:0,profit:0,monthProfit:0,yearProfit:0,achievements:[]}}
s=fresh();
const tabs=['街づくり','商品開発','社員','支店・海外','金融・株式','競合企業','決算・統計'];
let tab='街づくり';
function log(t){s.logs.unshift('Y'+s.year+' '+s.month+'月 '+s.day+'日｜'+t);s.logs=s.logs.slice(0,35)}
function spend(n){if(s.cash<n){log('資金不足です。');return false}s.cash-=n;return true}
function addFacility(i){let f=facilityTypes[i];if(!spend(f[2]))return;s.facilities.push({name:f[0],icon:f[1],cost:f[2]});s.rep=clamp(s.rep+1,0,100);log(f[0]+'を建設しました。');render()}
function nextDay(){s.day++;let income=0,cost=0;let f=s.facilities.length;income+=f*65000+s.employees*4200;cost+=s.employees*2300+f*9000;
s.products.forEach(p=>{let demand=Math.max(1,Math.floor((p.quality/10+4)*s.market/100*(1+s.rep/180)));let sold=Math.min(p.stock,demand);p.stock-=sold;p.sales+=sold;income+=sold*p.price;});
s.branches.forEach(b=>income+=b.income);
let interest=s.debt*s.loanRate/365;cost+=interest;
let net=income-cost;s.cash+=net;s.revenue+=income;s.expenses+=cost;s.profit+=net;s.monthProfit+=net;s.yearProfit+=net;
if(s.day>30){s.day=1;s.month++;log('月次締め：損益 '+yen(s.monthProfit));if(s.monthProfit>0)s.rep=clamp(s.rep+1,0,100);s.monthProfit=0;if(s.month>12){s.month=1;s.year++;let tax=Math.max(0,s.yearProfit*.2);s.cash-=tax;log('年次決算：税金 '+yen(tax)+' を納付。年間利益 '+yen(s.yearProfit));s.yearProfit=0;}}
if(Math.random()<.14){let ev=[['景気上昇。市場が活発になりました。',()=>s.market=clamp(s.market+8,65,145)],['景気後退。需要が落ち込みました。',()=>s.market=clamp(s.market-10,65,145)],['SNSで話題になり評判が上昇。',()=>s.rep=clamp(s.rep+5,0,100)],['設備トラブルが発生。修繕費が必要です。',()=>s.cash-=250000],['取引先が増加。臨時収入を獲得。',()=>s.cash+=400000]];let e=ev[Math.floor(Math.random()*ev.length)];e[1]();log('イベント：'+e[0]);}
s.rivals.forEach(r=>r.share=clamp(r.share+(Math.random()-.5)*1.5,5,35));s.market=clamp(s.market+(Math.random()-.5)*2,70,135);s.sharePrice=Math.max(10,Math.round(s.sharePrice*(1+(net/Math.max(1,s.cash+s.debt))*.025+(s.rep-50)/10000)));
if(s.debt>0&&s.day%30===0){let pay=Math.min(s.debt,Math.max(0,Math.floor(s.debt/24)));s.debt-=pay;s.cash-=pay;log('融資を定期返済 '+yen(pay));}
s.history.push({date:s.year+'/'+s.month+'/'+s.day,cash:s.cash,profit:net,market:s.market});s.history=s.history.slice(-90);render()}
function hire(){let n=Number($('hireCount').value)||1,c=n*180000;if(!spend(c))return;s.employees+=n;log(n+'人を採用しました。');render()}
function develop(){let p=s.products[0],q=Number($('quality').value),price=Number($('price').value);if(!spend(350000+q*8000))return;p.quality=clamp(q,10,100);p.price=Math.max(100,price);p.stock+=200;log('商品「'+p.name+'」を改良しました。');render()}
function loan(){let n=Number($('loanAmount').value);if(n<=0||n>50000000)return;s.cash+=n;s.debt+=n;log(yen(n)+'を銀行から借り入れました。');render()}
function repay(){let n=Math.min(s.debt,Number($('repayAmount').value)||0);if(n<=0||!spend(n))return;s.debt-=n;log(yen(n)+'を返済しました。');render()}
function ipo(){if(s.ipo)return;if(!spend(1200000))return;s.ipo=true;s.shares=1000000;s.cash+=Math.max(0,Math.round(s.sharePrice*s.shares*.08));log('株式上場を実施。市場で株式取引が始まりました。');render()}
function openBranch(i){let cost=i<4?2500000:8500000;if(s.branches.some(b=>b.name===branchNames[i]))return;if(!spend(cost))return;s.branches.push({name:branchNames[i],income:i<4?48000:90000});log(branchNames[i]+'に拠点を開設。');render()}
function dividend(){let amount=Math.floor(s.cash*.02);if(amount<=0||!s.ipo)return;s.cash-=amount;s.dividend+=amount;s.sharePrice=Math.max(10,s.sharePrice+2);log('株主へ '+yen(amount)+' の配当を実施。');render()}
function buyStock(){if(!s.ipo)return;let n=Number($('stockCount').value)||1,c=n*s.sharePrice;if(spend(c)){s.shares+=n;log(n+'株を買い戻しました。');render()}}
function render(){let worth=s.cash+s.debt*-1+s.facilities.reduce((a,f)=>a+f.cost*.7,0)+s.branches.length*1800000;
$('companyName').textContent=s.name;$('sector').textContent=s.sector;$('date').textContent='創業'+s.year+'年目 '+s.month+'月'+s.day+'日';$('cash').textContent=yen(s.cash);$('worth').textContent=yen(worth);$('share').textContent=s.ipo?yen(s.sharePrice):'未上場';$('staff').textContent=s.employees+'人';$('reputation').textContent=Math.round(s.rep)+' / '+Math.round((100-s.rivals.reduce((a,r)=>a+r.share,0))*.35)+'%';
$('skyline').innerHTML=s.facilities.slice(-8).map(f=>'<div class="building" style="height:'+(35+Math.random()*35)+'%"><b>'+f.icon+'</b></div>').join('')||'<div class="building" style="height:30%"><b>🏢</b></div>';
$('tabs').innerHTML=tabs.map(t=>'<button class="'+(tab===t?'active':'')+'" onclick="tab=\''+t+'\';render()">'+t+'</button>').join('');
let html='';
if(tab==='街づくり')html='<h2>都市開発・施設建設</h2><p class="muted">施設を増やして収益基盤を拡大します。</p><div class="grid">'+facilityTypes.map((f,i)=>'<article class="tile"><div style="font-size:30px">'+f[1]+'</div><h3>'+f[0]+'</h3><p>運営人員目安 '+f[3]+'人</p><div class="price">'+yen(f[2])+'</div><button onclick="addFacility('+i+')">建設する</button></article>').join('')+'</div><p>保有施設：'+s.facilities.length+'件</p>';
if(tab==='商品開発'){let p=s.products[0];html='<h2>商品・生産管理</h2><div class="tile"><h3>'+p.name+'</h3><p>品質 '+p.quality+'/100　販売価格 '+yen(p.price)+'</p><p>在庫 '+p.stock+'個　累計販売 '+p.sales+'個</p><label>品質設定</label><input id="quality" type="range" min="10" max="100" value="'+p.quality+'"><label>販売価格（円）</label><input id="price" type="number" value="'+p.price+'"><button class="primary" onclick="develop()">研究・改良（費用35万円〜）</button><p class="muted">改良すると品質と在庫が増加します。価格と品質が需要に影響します。</p></div>'}
if(tab==='社員')html='<h2>人材・組織管理</h2><div class="tile"><div style="font-size:34px">👥</div><h3>従業員 '+s.employees+'人</h3><p>給与・福利厚生は日々の支出に反映されます。</p><label>採用人数</label><input id="hireCount" type="number" min="1" max="50" value="3"><button onclick="hire()">採用する</button><p>採用費：1人18万円</p><button onclick="if(s.employees>1){s.employees--;log(\'人員を1名削減しました。\');render()}">人員を1名削減</button></div>';
if(tab==='支店・海外')html='<h2>国内・海外展開</h2><div class="grid">'+branchNames.map((n,i)=>'<article class="tile"><div style="font-size:28px">'+(i<4?'🏙️':'🌐')+'</div><h3>'+n+'</h3><p>'+(i<4?'国内拠点':'海外拠点')+' / 日次収益 '+yen(i<4?48000:90000)+'</p><button onclick="openBranch('+i+')" '+(s.branches.some(b=>b.name===n)?'disabled':'')+'>'+(s.branches.some(b=>b.name===n)?'開設済み':'拠点を開設')+'</button></article>').join('')+'</div>';
if(tab==='金融・株式')html='<h2>銀行・株式市場</h2><div class="grid"><div class="tile"><h3>🏦 銀行融資</h3><p>借入残高 '+yen(s.debt)+' / 年利 '+(s.loanRate*100).toFixed(1)+'%</p><label>借入額</label><input id="loanAmount" type="number" value="5000000"><button onclick="loan()">借り入れる</button><label>返済額</label><input id="repayAmount" type="number" value="500000"><button onclick="repay()">返済する</button></div><div class="tile"><h3>📈 株式市場</h3><p>状態：'+(s.ipo?'上場企業':'未上場')+' / 株価 '+yen(s.sharePrice)+'</p><p>発行株式 '+s.shares.toLocaleString()+'株</p><button onclick="ipo()" '+(s.ipo?'disabled':'')+'>IPO・新規上場（120万円）</button><label>買い戻し株数</label><input id="stockCount" type="number" value="100"><button onclick="buyStock()" '+(!s.ipo?'disabled':'')+'>自社株を買い戻す</button><button onclick="dividend()" '+(!s.ipo?'disabled':'')+'>配当を実施</button></div></div>';
if(tab==='競合企業')html='<h2>競合企業・市場シェア</h2><p>市場環境指数 '+Math.round(s.market)+'</p><div class="tile"><h3>自社</h3><div class="bar"><i style="width:'+clamp(s.rep,0,100)+'%"></i></div><p>評判 '+Math.round(s.rep)+'/100</p></div>'+s.rivals.map(r=>'<div class="tile"><div class="row"><b>'+r.name+'</b><b>'+r.share.toFixed(1)+'%</b></div><div class="bar"><i style="width:'+r.share*2+'%"></i></div></div>').join('')+'<p class="muted">競合のシェアは日ごとに変動します。商品品質と評判を高めて競争力を上げましょう。</p>';
if(tab==='決算・統計')html='<h2>決算・経営統計</h2><div class="grid"><div class="tile"><h3>今月の損益</h3><strong>'+yen(s.monthProfit)+'</strong></div><div class="tile"><h3>今年の損益</h3><strong>'+yen(s.yearProfit)+'</strong></div><div class="tile"><h3>累計売上</h3><strong>'+yen(s.revenue)+'</strong></div><div class="tile"><h3>累計支出</h3><strong>'+yen(s.expenses)+'</strong></div></div><h3>直近の業績推移</h3>'+s.history.slice(-12).map(h=>'<div class="row"><span>'+h.date+'</span><span>'+yen(h.profit)+'</span></div>').join('')+'<p>借入残高：'+yen(s.debt)+'　配当累計：'+yen(s.dividend)+'</p>';
$('main').innerHTML=html;
$('dashboard').innerHTML='<p>市場環境：<b>'+Math.round(s.market)+'</b></p><div class="bar"><i style="width:'+s.market/1.5+'%"></i></div><p>評判：<b>'+Math.round(s.rep)+'/100</b></p><div class="bar"><i style="width:'+s.rep+'%"></i></div><p>施設 '+s.facilities.length+'件 / 拠点 '+s.branches.length+'か所</p><p>負債 '+yen(s.debt)+'</p><p>当日収支：'+yen(s.profit)+'</p>';$('mood').textContent=s.market>110?'好景気':s.market<85?'不況':'安定';$('log').innerHTML=s.logs.map(x=>'<div>'+x+'</div>').join('')}
function save(){localStorage.setItem('businessEmpireSave',JSON.stringify(s));log('セーブしました。');render()}
function load(){let v=localStorage.getItem('businessEmpireSave');if(!v){log('セーブデータがありません。');render();return}s=JSON.parse(v);log('セーブデータを読み込みました。');render()}
function exportSave(){let b=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='business-empire-save.json';a.click();URL.revokeObjectURL(a.href)}
function importSave(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{s=JSON.parse(r.result);render();log('データを取り込みました。')}catch{alert('セーブデータを読み込めませんでした。')}};r.readAsText(f)}
render();
</script></body></html>
